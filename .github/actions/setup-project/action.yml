name: 'Setup Project'
description: 'Setup project with pnpm, Node.js, and dependencies'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
      with:
        install: false

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.tool-versions'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install
