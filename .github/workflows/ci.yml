name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: ./.github/actions/setup-project

      - run: pnpm lint:js

  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: ./.github/actions/setup-project

      - run: pnpm lint:style

  test:
    runs-on: ubuntu-latest
    # Prisma 経路のテストは実 DB を通すので、本番ではなく使い捨ての Postgres へ向ける
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/attt_test
      TEST_DATABASE_URL: postgresql://root:root@localhost:5432/attt_test
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: attt_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          TZ: 'Asia/Tokyo'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: ./.github/actions/setup-project

      - run: pnpm prisma migrate deploy

      - run: pnpm test

  ci:
    if: ${{ always() }}
    needs: [lint-js, lint-style, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          test "${{ needs.lint-js.result }}" = "success"
          test "${{ needs.lint-style.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
